# Financial Hub vhost for central-station.
#
# This is the canonical copy and it travels with the application, so a second
# machine can start from this repository alone. The file nginx actually reads
# lives in the platform repository:
#
#     d:\Repositories\vibe-city\nginx\conf.d\financial-hub.conf
#
# Install it with:
#
#     cp docker/nginx/financial-hub.conf d:/Repositories/vibe-city/nginx/conf.d/
#     docker exec central-station nginx -t
#     docker exec central-station nginx -s reload
#
# `central-station` is a standalone container rather than a compose service, so
# there is no compose project to address it through. Reloading needs no
# downtime and does not touch d:\Repositories\vibe-city\start.ps1.
#
# ---------------------------------------------------------------------------
# DO NOT INSTALL THIS BEFORE THE `financial-hub` CONTAINER EXISTS.
# ---------------------------------------------------------------------------
# `proxy_pass` to a literal hostname is resolved when nginx starts, not per
# request. With no `financial-hub` container on the vibe-city network, nginx
# fails to start — and central-station is shared, so that takes
# control-tower.localhost down with it. Install this file at the moment the
# image first runs, and validate with `nginx -t` before reloading.
#
# Follows control-tower.conf exactly, which is the established pattern for
# adding a tenant to this platform.

server {
    listen 80;
    server_name financial-hub.localhost;

    # Monthly close is a long typing session, not a large upload. The only
    # sizeable response is a CSV export.
    client_max_body_size 4m;

    location / {
        proxy_pass http://financial-hub:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # There is no TLS anywhere in this topology, so Django's
        # SECURE_PROXY_SSL_HEADER stays unset. If central-station ever
        # terminates TLS in front of this, set it then and not before —
        # trusting X-Forwarded-Proto while the scheme is still http marks the
        # session cookie secure and locks the user out of their own data.
    }
}
