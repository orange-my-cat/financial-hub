[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = core accounts cashflow investments fx

# 80% line coverage is the floor, not the goal (ADR-17). Coverage measures lines
# executed, not arithmetic proven — a FIFO replay can reach 100% from a single
# simple sale while never testing a partial lot consumption. The ceiling is the
# named-edge-case and hand-worked-scenario suites at Stages 1, 2 and 4.
addopts =
    --strict-markers
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=80

markers =
    invariant: financial invariant. Runs alone in seconds via `pytest -m invariant`, so the arithmetic can be re-checked without waiting for the whole suite.
